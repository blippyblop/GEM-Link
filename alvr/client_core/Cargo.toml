[package]
name = "alvr_client_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
link-stdcpp-shared = []
default = ["link-stdcpp-shared"]

[dependencies]
alvr_audio.workspace = true
alvr_common.workspace = true
alvr_graphics.workspace = true
alvr_packets.workspace = true
alvr_session.workspace = true
alvr_sockets.workspace = true
alvr_system_info.workspace = true
# The per-frame video header travels in front of the frame's bytes on the media plane, so the two
# ends must agree on how it is laid out. The same codec `alvr_sockets` uses for its stream headers.
bincode = { version = "2", features = ["serde"] }

app_dirs2 = "2"
mdns-sd = "0.19"
rand = "0.10"
serde = "1"
serde_json = "1"
x-transport = { path = "../x-transport" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
ndk = { version = "0.9", features = ["api-level-28", "audio", "media"] }
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
