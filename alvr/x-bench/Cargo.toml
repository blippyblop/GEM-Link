[package]
name = "x-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["GemLink contributors"]
description = "GemLink measurement harness: deterministic loopback scenarios, impairment profiles, and gates"

[dependencies]
alvr_packets.workspace = true
alvr_common.workspace = true
alvr_sockets.workspace = true
alvr_session.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x-crypto = { path = "../x-crypto" }
x-foveation = { path = "../x-foveation" }
x-link = { path = "../x-link" }
x-protocol = { path = "../x-protocol" }

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
