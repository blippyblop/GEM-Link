[package]
name = "x-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["GemLink contributors"]
description = "GemLink media plane: frame packetisation, GF(256) FEC, pacing, per-datagram AEAD, and a receiver that cannot present an unreconstructable frame"

[dependencies]
chacha20poly1305 = "0.10"
# The media-key KDF. HMAC-SHA256 rather than a bare hash: see `KeySchedule` for why the
# construction should not depend on the caller passing a uniformly random secret.
hmac = "0.12"
log = "0.4"
sha2 = "0.10"

[dev-dependencies]
rand_chacha = "0.3"
