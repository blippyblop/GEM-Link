name: GemLink Linux CI

# SECURITY (ADR-0007): self-hosted runner policy.
# - No pull_request trigger: fork PRs must never execute workflows on the
#   self-hosted GPU runner (cargo build scripts = arbitrary code).
# - push (master) + workflow_dispatch both require repo write access.
# - Repository guard on every job: fork copies never touch the runner.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  linux-tier:
    if: github.repository == 'blippyblop/GEM-Link'
    name: linux tier (build, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt -p x-protocol -p x-bench -p x-crypto -- --check
      - name: Build
        run: cargo build -p x-protocol -p x-bench -p x-crypto
      - name: Clippy
        run: cargo clippy -p x-protocol -p x-bench -p x-crypto -- -D warnings
      - name: Test
        run: cargo test -p x-protocol -p x-bench -p x-crypto

  bench-gates:
    if: github.repository == 'blippyblop/GEM-Link'
    name: bench golden gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Build bench
        run: cargo build -p x-bench --bin bench
      - name: Run scenarios and gate against goldens
        run: |
          set -e
          for s in frame_ncm frame_wifi7_160 frame_wifi7_regrace frame_cqm_churn quest_pro_wifi6 quest3_wifi6; do
            cargo run -q -p x-bench --bin bench -- run "$s" --seed 42 --iterations 50 --out runs
          done
          for f in runs/*/metrics.json; do
            echo "=== gating $f ==="
            cargo run -q -p x-bench --bin bench -- gate --run "$f" --goldens bench/goldens
          done

  windows-gpu-tier:
    if: github.repository == 'blippyblop/GEM-Link'
    name: windows GPU tier (nvenc delivery gates)
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build (portable toolchain, C:\Gemlink\tools)
        shell: cmd
        run: |
          set RUSTUP_HOME=C:\Gemlink\tools\rustup
          set CARGO_HOME=C:\Gemlink\tools\cargo
          set PATH=C:\Gemlink\tools\cargo\bin;%PATH%
          cargo --version
          cargo build --release -p x-dda --bin nvenc_probe -p x-bench --bin bench
      - name: Unit tests
        shell: cmd
        run: |
          set RUSTUP_HOME=C:\Gemlink\tools\rustup
          set CARGO_HOME=C:\Gemlink\tools\cargo
          set PATH=C:\Gemlink\tools\cargo\bin;%PATH%
          cargo test -p x-protocol -p x-bench -p x-crypto
      - name: NVENC delivery gates (8-bit)
        shell: cmd
        run: |
          set PATH=C:\Gemlink\tools\cargo\bin;%PATH%
          target\release\bench.exe nvenc --seconds 6
      - name: NVENC delivery gates (10-bit)
        shell: cmd
        run: |
          set PATH=C:\Gemlink\tools\cargo\bin;%PATH%
          target\release\bench.exe nvenc --bit10 --seconds 6
