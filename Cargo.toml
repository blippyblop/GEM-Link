[workspace]
resolver = "2"
members = ["alvr/*"]
# x-idd is a Windows Indirect Display Driver (WDK/msbuild), NOT a Rust crate.
# Without this exclusion the alvr/* glob picks it up and cargo fails to load the
# workspace manifest for EVERY command in the repo (including CI).
exclude = ["alvr/x-idd"]

[workspace.package]
version = "21.0.0-dev14"
edition = "2024"
rust-version = "1.92"
authors = ["alvr-org"]
license = "MIT"

[workspace.dependencies]
alvr_adb = { path = "alvr/adb" }
alvr_audio = { path = "alvr/audio" }
alvr_client_core = { path = "alvr/client_core" }
alvr_common = { path = "alvr/common" }
alvr_events = { path = "alvr/events" }
alvr_filesystem = { path = "alvr/filesystem" }
alvr_graphics = { path = "alvr/graphics" }
alvr_gui_common = { path = "alvr/gui_common" }
alvr_packets = { path = "alvr/packets" }
alvr_server_core = { path = "alvr/server_core"}
alvr_server_io = { path = "alvr/server_io" }
alvr_session = { path = "alvr/session" }
alvr_sockets = { path = "alvr/sockets" }
alvr_system_info = { path = "alvr/system_info" }

# Release-speed build with the dbg_* tracing compiled in.
#
# Every dbg_* macro in alvr_common::logging is gated on cfg(debug_assertions),
# and the C++ side reaches them through alvr_dbg_server_impl, so a plain release
# build silently drops all of it: the connection/frame/encoder tracing simply
# does not exist in the artifact. That makes "the stream never starts" very hard
# to diagnose from the release binary.
#
# This profile keeps release codegen and the release CRT (so the driver still
# loads the same way) while enabling the tracing:
#     cargo build -p alvr_server_openvr --profile traced
[profile.traced]
inherits = "release"
debug-assertions = true

[profile.release]
debug = "limited"
strip = false

[profile.distribution]
inherits = "release"
lto = true
